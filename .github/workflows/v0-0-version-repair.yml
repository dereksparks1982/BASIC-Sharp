name: Remove temporary repair branch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v0-0-version-repair.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete temporary branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete repair-v0-0-version-truth 2>/dev/null || true
          echo 'Remote branches:'
          git ls-remote --heads origin
