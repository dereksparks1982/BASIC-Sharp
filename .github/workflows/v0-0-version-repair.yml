name: BASIC# v0.0 numbering repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v0-0-version-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct v0.1 numbering to v0.0
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import subprocess, re

          workflow = '.github/workflows/v0-0-version-repair.yml'
          tracked = subprocess.check_output(['git','ls-files'], text=True).splitlines()

          for old in sorted(tracked, key=len, reverse=True):
              if old == workflow:
                  continue
              p = Path(old)
              new_name = p.name.replace('v0_1_','v0_0_').replace('V0_1_','V0_0_').replace('v0.1.','v0.0.').replace('V0.1.','V0.0.')
              if new_name != p.name:
                  q = p.with_name(new_name)
                  subprocess.run(['git','mv','--',str(p),str(q)], check=True)

          tracked = subprocess.check_output(['git','ls-files'], text=True).splitlines()
          for name in tracked:
              if name == workflow:
                  continue
              p = Path(name)
              if not p.is_file():
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              new = text.replace('v0.1.','v0.0.').replace('V0.1.','V0.0.').replace('v0_1_','v0_0_').replace('V0_1_','V0_0_')
              new = re.sub(r'(?<![0-9])0\.1\.(?=[0-9])','0.0.',new)
              new = re.sub(r'(?<![0-9])0_1_(?=[0-9])','0_0_',new)
              if new != text:
                  p.write_text(new, encoding='utf-8')
          PY

          git add -A
          git grep --cached -n -I -E 'v0\.1\.[0-9]+|0\.1\.[0-9]+|v0_1_[0-9]+' -- . ':!.github/workflows/v0-0-version-repair.yml' && exit 1 || true
          git ls-files | grep -E 'v0_1_[0-9]+' && exit 1 || true

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BASIC# Repository Repair'
          git config user.email 'basic-sharp@users.noreply.github.com'
          git add -A
          git reset -- .github/workflows/v0-0-version-repair.yml
          git commit -m 'Correct BASIC# version numbering to v0.0 series'
          git push origin HEAD:main
