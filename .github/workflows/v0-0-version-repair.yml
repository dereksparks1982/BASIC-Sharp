name: BASIC# v0.0.84 final audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v0-0-version-repair.yml'

permissions:
  contents: write

jobs:
  final-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Finalize current project truth
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import hashlib, json, re

          bible = Path('docs/company_bible/BASIC_SHARP_COMPANY_BIBLE.md')
          t = bible.read_text(encoding='utf-8')
          t = t.replace('**Authority:** Project creator / final decision-maker  ', '**Authority:** Final decision authority  ')
          t = t.replace('## 2. Project creator is the final decision-maker', '## 2. Final decision authority')
          t = t.replace('the project creator is the owner and final authority for BASIC#, Elderedd Laboratory, and BCS direction.', 'The final decision authority governs BASIC#, Elderedd Laboratory, and BCS direction.')
          t = t.replace('Tools advise, report, and validate. They do not overrule the project creator.', 'Tools advise, report, and validate. They do not overrule approved project direction.')
          t = t.replace('An explicit current instruction from the project creator governs the approved work.', 'An explicit current instruction governs the approved work.')
          t = re.sub(r'^- Historical records that use the name .*?\n', '', t, flags=re.M)
          t = t.replace('Acknowledge the project creator before beginning lengthy inspection or tool work.', 'Acknowledge the current instruction before beginning lengthy inspection or tool work.')
          t = t.replace('Ask the project creator only when the records do not answer the question or an owner-only decision remains.', 'Ask only when the records do not answer the question or an approval-only decision remains.')
          t = t.replace('Do not ask the project creator to repeat a decision already preserved in current project records.', 'Do not ask for a decision to be repeated when it is already preserved in current project records.')
          t = t.replace('Implementation begins only after the project creator explicitly approves that stated scope with a build or patch command.', 'Implementation begins only after explicit approval of the stated scope with a build or patch command.')
          t = t.replace('When the project creator says **stop**, all build, tool, packaging, and implementation work stops immediately. Answer him plainly instead of continuing silent work.', 'When a **stop** instruction is given, all build, tool, packaging, and implementation work stops immediately. Answer plainly instead of continuing silent work.')
          t = t.replace('Once the project creator approves an exact build:', 'Once an exact build is explicitly approved:')
          t = t.replace('unless the project creator changes the scope', 'unless the approved scope changes')
          t = t.replace('After the project creator accepts a build,', 'After a build is accepted,')
          t = t.replace('when the project creator asks for the faster shell-installer path', 'when the faster shell-installer path is requested')
          t = t.replace('when the project creator explicitly requests it', 'when explicitly requested')
          t = t.replace('unless the project creator explicitly requests otherwise', 'unless explicitly requested otherwise')
          t = t.replace('unless the project creator asks', 'unless explicitly requested')
          t = t.replace('only when the project creator requests it', 'only when explicitly requested')
          t = t.replace("the project creator's explicit approval", 'explicit approval')
          t = t.replace('the project creator may explicitly accept', 'A documented exception may be explicitly accepted')
          t = t.replace('the project creator asks about it', 'it is explicitly requested')
          t = t.replace('waiting for the project creator to ask what comes next', 'waiting for another prompt')
          t = t.replace('Only generate or edit an image when the project creator gives a clear direct command', 'Only generate or edit an image when a clear direct command explicitly requests image work')
          t = t.replace('Never make the BASIC# GitHub repository public unless the project creator explicitly commands that exact visibility change. The BASIC# GitHub repository must never be made public unless the project creator explicitly commands that exact visibility change. Normal `git push` is allowed because pushing does not change repository visibility.', 'The BASIC# GitHub repository is public. Repository visibility must not change again without explicit approval. Normal `git push` does not change repository visibility.')
          t = t.replace('project creator', 'final decision authority')
          bible.write_text(t, encoding='utf-8')

          audit = Path('tools/company_bible_audit.rb')
          t = audit.read_text(encoding='utf-8')
          replacements = {
            "'Derek is the owner and final authority'": "'The final decision authority governs BASIC#'",
            "'Acknowledge Derek before beginning lengthy inspection or tool work.'": "'Acknowledge the current instruction before beginning lengthy inspection or tool work.'",
            "'Implementation begins only after Derek explicitly approves'": "'Implementation begins only after explicit approval'",
            "'When Derek says **stop**'": "'When a **stop** instruction is given'",
            "'Only generate or edit an image when Derek gives a clear direct command'": "'Only generate or edit an image when a clear direct command explicitly requests image work'",
            "'Never make the BASIC# GitHub repository public'": "'The BASIC# GitHub repository is public.'"
          }
          for old, new in replacements.items():
              t = t.replace(old, new)
          audit.write_text(t, encoding='utf-8')

          roadmap = Path('docs/roadmap/BASIC_SHARP_ROADMAP.md')
          t = roadmap.read_text(encoding='utf-8')
          t = t.replace('use a changed-files ZIP only when the project creator explicitly requests that packaging path.', 'use a changed-files ZIP only when that packaging path is explicitly requested.')
          t = t.replace('project creator', 'final decision authority')
          roadmap.write_text(t, encoding='utf-8')

          handoff = Path('docs/hand_off/BASIC_SHARP_MASTER_THREAD_HANDOFF.md')
          t = handoff.read_text(encoding='utf-8')
          t = t.replace('The repaired candidate must also pass `tools/company_bible_audit.rb` after the rejected v0.0.84 current-reference failure.', 'The accepted v0.0.84 release passed `tools/company_bible_audit.rb` after the rejected current-reference failure was repaired.')
          start = t.find('## Current validation floor')
          end = t.find('## Release workflow')
          floor = '''## Current validation floor\n\nAccepted v0.0.84 validation floor:\n\n```text\n87 test files\n692 runs\nminimum 10,190 assertions\n0 failures\n0 errors\n0 skips\n75 required tools\n386 sealed artifacts\n14 protected artifacts\n```\n\nComplete normal and no-locale suites, every sealed required tool, deterministic sweep, release preflight, forensic overlay, whole-language gauntlet, and full-count Trial by Fire remain mandatory before `FINAL PASS`.\n\n'''
          if start >= 0 and end > start:
              t = t[:start] + floor + t[end:]
          t = t.replace('Run the single self-contained versioned `.sh` installer against exact accepted v0.0.83.', 'Run the next self-contained versioned `.sh` installer against exact accepted v0.0.84.')
          t = t.replace('Verify exact v0.0.83 HEAD/tag/branch/clean tree and all base-file hashes before mutation.', 'Verify exact v0.0.84 HEAD/tag/branch/clean tree and all base-file hashes before mutation.')
          t = t.replace('After the project creator sees FINAL PASS:', 'After FINAL PASS is confirmed:')
          t = t.replace('project creator', 'final decision authority')
          handoff.write_text(t, encoding='utf-8')

          # Refresh path-bound bytes/SHA-256 records after the final documentation/audit repair.
          def refresh(value, current):
              changed = False
              if isinstance(value, dict):
                  path = value.get('path')
                  if isinstance(path, str) and Path(path).is_file() and Path(path).resolve() != current.resolve():
                      data = Path(path).read_bytes()
                      if 'bytes' in value and value['bytes'] != len(data):
                          value['bytes'] = len(data); changed = True
                      digest = hashlib.sha256(data).hexdigest()
                      if 'sha256' in value and value['sha256'] != digest:
                          value['sha256'] = digest; changed = True
                  for child in value.values():
                      changed = refresh(child, current) or changed
              elif isinstance(value, list):
                  for child in value:
                      changed = refresh(child, current) or changed
              return changed

          for _ in range(8):
              any_change = False
              for path in sorted(Path('.').rglob('*.json')):
                  if '.git' in path.parts:
                      continue
                  try:
                      obj = json.loads(path.read_text(encoding='utf-8'))
                  except Exception:
                      continue
                  if refresh(obj, path):
                      path.write_text(json.dumps(obj, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
                      any_change = True
              if not any_change:
                  break
          PY

          git add -A
          echo 'PHASE START: current-truth audit'
          if git grep --cached -n -I -E 'v0\.1\.[0-9]+|0\.1\.[0-9]+|v0_1_[0-9]+' -- . ':!.github/workflows/v0-0-version-repair.yml'; then
            echo 'FAIL: wrong v0.1 namespace remains in live tree'
            exit 1
          fi
          grep -q "VERSION = '0.0.84'" compiler/ast_nodes.rb
          grep -q '^## Technical History$' README.md
          grep -q '^### v0.0.84 ' README.md
          grep -q '^### v0.0.01 ' README.md
          grep -q '^## License / Legal$' README.md
          grep -q '^\*\*Version:\*\* v0.0.84' docs/company_bible/BASIC_SHARP_COMPANY_BIBLE.md
          grep -q 'The BASIC# GitHub repository is public.' docs/company_bible/BASIC_SHARP_COMPANY_BIBLE.md
          grep -q 'Accepted release:.*v0.0.84' docs/hand_off/BASIC_SHARP_MASTER_THREAD_HANDOFF.md
          grep -q 'Next build:.*v0.0.85' docs/hand_off/BASIC_SHARP_MASTER_THREAD_HANDOFF.md
          grep -q 'Run the next self-contained versioned.*v0.0.84' docs/hand_off/BASIC_SHARP_MASTER_THREAD_HANDOFF.md
          echo 'PHASE PASS: current-truth audit'

      - name: Commit final truth repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BASIC# Repository Repair'
          git config user.email 'basic-sharp@users.noreply.github.com'
          git add -A
          git reset -- .github/workflows/v0-0-version-repair.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Finalize BASIC# v0.0.84 repository truth'
            git push origin HEAD:main
          fi
          test -z "$(git status --porcelain)"
          echo 'PHASE PASS: clean committed tree'

      - name: Full normal and no-locale suites
        shell: bash
        run: |
          set -euo pipefail
          echo 'PHASE START: normal full suite'
          ruby -I. -Itests -e 'Dir["tests/test_*.rb"].sort.each { |f| require File.expand_path(f) }' | tee /tmp/normal.txt
          echo 'PHASE START: no-locale full suite'
          LANG=C LC_ALL=C ruby -I. -Itests -e 'Dir["tests/test_*.rb"].sort.each { |f| require File.expand_path(f) }' | tee /tmp/no_locale.txt
          python3 <<'PY'
          import re
          for label, path in [('normal','/tmp/normal.txt'),('no-locale','/tmp/no_locale.txt')]:
              text=open(path,encoding='utf-8').read()
              matches=re.findall(r'(\d+) runs, (\d+) assertions, (\d+) failures, (\d+) errors, (\d+) skips',text)
              if not matches:
                  raise SystemExit(f'{label}: suite summary missing')
              runs, assertions, failures, errors, skips=map(int,matches[-1])
              if runs < 692 or assertions < 10190 or failures or errors or skips:
                  raise SystemExit(f'{label}: unacceptable suite result {matches[-1]}')
              print(f'PHASE PASS: {label} suite {runs} runs / {assertions} assertions / 0 failures / 0 errors / 0 skips')
          PY

      - name: Run every sealed required tool
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY' > /tmp/required_tools.txt
          import json
          inv=json.load(open('spec/trial_by_fire/BASIC_SHARP_TRIAL_BY_FIRE_VALIDATION_INVENTORY_v1.json',encoding='utf-8'))
          for item in inv['required_tools']:
              print(item['path'])
          PY
          count="$(wc -l < /tmp/required_tools.txt | tr -d ' ')"
          [ "$count" = '75' ] || { echo "FAIL: expected 75 required tools, found $count"; exit 1; }
          while IFS= read -r tool; do
            echo "PHASE START: $tool"
            ruby "$tool"
            echo "PHASE PASS: $tool"
          done < /tmp/required_tools.txt
          if ! grep -Fxq 'tools/trial_by_fire_gauntlet.rb' /tmp/required_tools.txt; then
            echo 'PHASE START: full Trial by Fire gauntlet'
            ruby tools/trial_by_fire_gauntlet.rb
            echo 'PHASE PASS: full Trial by Fire gauntlet'
          fi
          echo 'PHASE PASS: all 75 sealed required tools'

      - name: Verify remote Git truth
        shell: bash
        run: |
          set -euo pipefail
          echo 'PHASE START: remote Git audit'
          branches="$(git ls-remote --heads origin)"
          [ "$(printf '%s\n' "$branches" | grep -c 'refs/heads/')" = '1' ]
          printf '%s\n' "$branches" | grep -q 'refs/heads/main$'
          if git ls-remote --tags origin 'refs/tags/v0.1.*' | grep -q .; then
            echo 'FAIL: remote v0.1 tags remain'
            exit 1
          fi
          git ls-remote --tags origin 'refs/tags/v0.0.84' | grep -q 'refs/tags/v0.0.84$'
          echo 'PHASE PASS: one branch, main only, v0.0.84 tag present, no v0.1 tags'

      - name: Try to correct GitHub repository description
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}" -f description='BASIC# v0.0.84: Native Action Routing Integration' >/tmp/repo_update.json
          echo 'PHASE PASS: GitHub repository description updated'

      - name: Final result
        shell: bash
        run: |
          set -euo pipefail
          echo 'FINAL PASS: BASIC# v0.0.84 live repository tree and validation are clean'
